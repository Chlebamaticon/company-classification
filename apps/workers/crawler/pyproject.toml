[project]
name = "crawler-worker"
version = "0.1.0"
description = "Website crawl worker for SalesPatriot FSC classifier."
requires-python = ">=3.12"
dependencies = [
    "salespatriot-shared",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "tldextract>=5,<6",
    "aio-pika>=9.4,<10",
    "asyncpg>=0.29,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crawler*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
