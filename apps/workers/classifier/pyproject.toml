[project]
name = "classifier-worker"
version = "0.1.0"
description = "FSC classification worker for SalesPatriot."
requires-python = ">=3.12"
dependencies = [
    "salespatriot-shared",
    "aio-pika>=9.4,<10",
    "asyncpg>=0.29,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["classifier*"]
