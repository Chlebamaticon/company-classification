[project]
name = "doc-ingest-worker"
version = "0.1.0"
description = "PDF document ingest worker for SalesPatriot FSC classifier."
requires-python = ">=3.12"
dependencies = [
    "salespatriot-shared",
    "pdfplumber>=0.11,<1",
    "aio-pika>=9.4,<10",
    "asyncpg>=0.29,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "reportlab>=4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["doc_ingest*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
