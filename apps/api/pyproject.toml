[project]
name = "salespatriot-api"
version = "0.1.0"
description = "FastAPI gateway for SalesPatriot FSC classifier."
requires-python = ">=3.12"
dependencies = [
    "salespatriot-shared",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "aio-pika>=9.4,<10",
    "asyncpg>=0.29,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*"]
