<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SalesPatriot FSC Classifier — Architecture</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f8fafc;
    color: #0f172a;
  }
  header { padding: 24px 40px 8px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .subtitle { margin: 4px 0 0; color: #64748b; font-size: 14px; }
  main { padding: 16px 40px 40px; }
  svg {
    display: block;
    width: 100%;
    height: auto;
    max-width: 1300px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
  }
  .lane { stroke: #cbd5e1; stroke-dasharray: 4 4; }
  .lane-label {
    font-size: 12px;
    fill: #475569;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .node rect {
    fill: #ffffff;
    stroke: #334155;
    stroke-width: 1.5;
    filter: url(#shadow);
  }
  .node text {
    font-size: 13px;
    font-weight: 600;
    fill: #0f172a;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .node .subtype { font-size: 11px; font-weight: 400; fill: #64748b; }
  .node.mq rect { fill: #fff7ed; stroke: #c2410c; }
  .node.db rect { fill: #fdf2f8; stroke: #be185d; }
  .node.ext rect { fill: #faf5ff; stroke: #7e22ce; stroke-dasharray: 4 4; }
  .edge { fill: none; stroke-width: 1.6; }
  .edge.http   { stroke: #2563eb; }
  .edge.sse    { stroke: #2563eb; stroke-dasharray: 5 4; }
  .edge.amqp   { stroke: #c2410c; }
  .edge.rpc    { stroke: #c2410c; stroke-dasharray: 5 4; }
  .edge.sql    { stroke: #15803d; }
  .edge.notify { stroke: #15803d; stroke-dasharray: 2 4; }
  .edge.https  { stroke: #7e22ce; }
  .elabel {
    font-size: 11px;
    fill: #0f172a;
    text-anchor: middle;
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 4;
    stroke-linejoin: round;
  }
  .elabel.notify-l { fill: #15803d; }
  .elabel.sql-l    { fill: #15803d; }
  .elabel.https-l  { fill: #7e22ce; }
  .legend {
    margin: 16px auto 0;
    max-width: 1300px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px 24px;
    font-size: 13px;
    color: #334155;
  }
  .legend .item { display: flex; align-items: center; gap: 8px; }
  .legend .swatch {
    display: inline-block;
    width: 28px;
    height: 0;
    border-top: 2px solid #2563eb;
  }
  .legend .swatch.sse    { border-top: 2px dashed #2563eb; }
  .legend .swatch.amqp   { border-top: 2px solid #c2410c; }
  .legend .swatch.rpc    { border-top: 2px dashed #c2410c; }
  .legend .swatch.sql    { border-top: 2px solid #15803d; }
  .legend .swatch.notify { border-top: 2px dotted #15803d; }
  .legend .swatch.https  { border-top: 2px solid #7e22ce; }
</style>
</head>
<body>
<header>
  <h1>SalesPatriot FSC Classifier — High-Level Architecture</h1>
  <p class="subtitle">Left → Right: Client → API → Message Bus → Workers → Data + External</p>
</header>
<main>
<svg viewBox="0 0 1300 720" role="img" aria-label="High-level architecture diagram, left to right">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amqp"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrow-sql"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-https" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7e22ce"/>
    </marker>
  </defs>

  <g>
    <rect class="lane" x="20"  y="40" width="200" height="640" rx="10" fill="#eff6ff"/>
    <text class="lane-label" x="120"  y="62" text-anchor="middle">Client</text>
  </g>
  <g>
    <rect class="lane" x="240" y="40" width="200" height="640" rx="10" fill="#ecfeff"/>
    <text class="lane-label" x="340"  y="62" text-anchor="middle">API</text>
  </g>
  <g>
    <rect class="lane" x="460" y="40" width="200" height="640" rx="10" fill="#fff7ed"/>
    <text class="lane-label" x="560"  y="62" text-anchor="middle">Message Bus</text>
  </g>
  <g>
    <rect class="lane" x="680" y="40" width="260" height="640" rx="10" fill="#f0fdf4"/>
    <text class="lane-label" x="810"  y="62" text-anchor="middle">Workers</text>
  </g>
  <g>
    <rect class="lane" x="960" y="40" width="220" height="640" rx="10" fill="#fdf4ff"/>
    <text class="lane-label" x="1070" y="62" text-anchor="middle">Data + External</text>
  </g>

  <path class="edge http"   d="M 200 335 L 260 335" marker-end="url(#arrow-blue)"/>
  <path class="edge sse"    d="M 260 365 L 200 365" marker-end="url(#arrow-blue)"/>

  <path class="edge amqp"   d="M 420 350 L 480 350" marker-end="url(#arrow-amqp)"/>

  <path class="edge sql"    d="M 320 305 L 320 90  L 1050 90  L 1050 160" marker-end="url(#arrow-sql)"/>
  <path class="edge notify" d="M 1090 160 L 1090 115 L 360 115 L 360 305" marker-end="url(#arrow-sql)"/>

  <path class="edge amqp"   d="M 620 320 C 660 280, 670 220, 700 180" marker-end="url(#arrow-amqp)"/>
  <path class="edge rpc"    d="M 720 205 C 680 245, 660 295, 620 335" marker-end="url(#arrow-amqp)"/>

  <path class="edge amqp"   d="M 640 340 L 700 340" marker-end="url(#arrow-amqp)"/>
  <path class="edge rpc"    d="M 700 360 L 640 360" marker-end="url(#arrow-amqp)"/>

  <path class="edge amqp"   d="M 620 380 C 660 420, 670 480, 700 520" marker-end="url(#arrow-amqp)"/>
  <path class="edge rpc"    d="M 720 540 C 680 500, 660 440, 620 385" marker-end="url(#arrow-amqp)"/>

  <path class="edge https"  d="M 920 200 C 970 280, 1010 380, 1030 460" marker-end="url(#arrow-https)"/>

  <path class="edge sql"    d="M 920 165 C 945 162, 965 178, 985 195" marker-end="url(#arrow-sql)"/>
  <path class="edge sql"    d="M 920 335 C 955 320, 985 280, 1005 240" marker-end="url(#arrow-sql)"/>
  <path class="edge sql"    d="M 920 510 L 945 510 L 945 230 L 1030 230 L 1030 240" marker-end="url(#arrow-sql)"/>

  <g class="node">
    <rect x="40"  y="305" width="160" height="80" rx="10"/>
    <text x="120" y="340">React SPA</text>
    <text class="subtype" x="120" y="360">Vite · TS · Tailwind</text>
  </g>

  <g class="node">
    <rect x="260" y="305" width="160" height="80" rx="10"/>
    <text x="340" y="340">FastAPI</text>
    <text class="subtype" x="340" y="360">/submissions · SSE</text>
  </g>

  <g class="node mq">
    <rect x="480" y="305" width="160" height="80" rx="10"/>
    <text x="560" y="340">RabbitMQ</text>
    <text class="subtype" x="560" y="360">topic + RPC reply</text>
  </g>

  <g class="node">
    <rect x="700" y="140" width="220" height="80" rx="10"/>
    <text x="810" y="175">Classification Worker</text>
    <text class="subtype" x="810" y="195">orchestrator · LLM · FSC</text>
  </g>

  <g class="node">
    <rect x="700" y="305" width="220" height="80" rx="10"/>
    <text x="810" y="340">Doc Ingest Worker</text>
    <text class="subtype" x="810" y="360">pdfplumber · extract</text>
  </g>

  <g class="node">
    <rect x="700" y="480" width="220" height="80" rx="10"/>
    <text x="810" y="515">Web Crawl Worker</text>
    <text class="subtype" x="810" y="535">httpx · BeautifulSoup</text>
  </g>

  <g class="node db">
    <rect x="980" y="160" width="180" height="80" rx="10"/>
    <text x="1070" y="195">Postgres</text>
    <text class="subtype" x="1070" y="215">submissions · events</text>
  </g>

  <g class="node ext">
    <rect x="980" y="460" width="180" height="80" rx="10"/>
    <text x="1070" y="495">OpenAI</text>
    <text class="subtype" x="1070" y="515">chat.completions (JSON)</text>
  </g>

  <text class="elabel" x="230" y="326">POST /submissions</text>
  <text class="elabel" x="230" y="382">SSE events</text>
  <text class="elabel" x="450" y="343">classify.request</text>
  <text class="elabel sql-l"    x="685" y="82">persist (SQL)</text>
  <text class="elabel notify-l" x="725" y="108">LISTEN/NOTIFY submission_events:{id}</text>
  <text class="elabel" x="660" y="245">classify.request</text>
  <text class="elabel" x="660" y="290">ingest/crawl.request (RPC)</text>
  <text class="elabel" x="670" y="333">ingest.request</text>
  <text class="elabel" x="670" y="378">reply</text>
  <text class="elabel" x="660" y="455">crawl.request</text>
  <text class="elabel" x="665" y="498">reply</text>
  <text class="elabel https-l" x="990" y="365">chat.completions (HTTPS)</text>
  <text class="elabel sql-l"   x="955" y="295">persist events + artifacts</text>
</svg>

<div class="legend" aria-label="Edge legend">
  <div class="item"><span class="swatch"></span>HTTP (request)</div>
  <div class="item"><span class="swatch sse"></span>SSE (server push)</div>
  <div class="item"><span class="swatch amqp"></span>AMQP publish</div>
  <div class="item"><span class="swatch rpc"></span>AMQP RPC reply</div>
  <div class="item"><span class="swatch sql"></span>SQL persist</div>
  <div class="item"><span class="swatch notify"></span>Postgres NOTIFY</div>
  <div class="item"><span class="swatch https"></span>HTTPS (external)</div>
</div>
</main>
</body>
</html>
