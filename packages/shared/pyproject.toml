[project]
name = "salespatriot-shared"
version = "0.1.0"
description = "Shared contracts and helpers for the SalesPatriot FSC classifier monorepo."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "aio-pika>=9.4,<10",
    "asyncpg>=0.29,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "openai>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["salespatriot_shared*"]
